<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хильдред</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #000;
        }

        .container {
            width: min(700px, 92%);
            padding: 40px;

            background: #d9d9d9;
            border-radius: 8px;

            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: 500;
        }

        p {
            margin: 0 0 25px;
            color: #333;
            font-size: 15px;
        }

        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 5px;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Небольшой сюрприз для тебя.</h1>

        <div class="video">
            <iframe 
		width="560" 
		height="315" 
		src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=zCF-2NKowVBRqFx7&amp;controls=0" 
		title="YouTube video player" 
		frameborder="0" 
		allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; 
		web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
	    </iframe>
        </div>

    </main>

</body>
</html>
