<!DOCTYPE html>

<html lang="ru">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  
  <title>Хильдред</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;

        font-family: Arial, Helvetica, sans-serif;
        background: #000;
        color: #000;
    }

    .container {
        width: min(700px, 90%);
        min-height: 220px;
        padding: 40px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #d9d9d9;
        border-radius: 8px;

        text-align: center;
        font-size: 20px;
        line-height: 1.5;
    }

    @media (max-width: 480px) {
        .container {
            width: 92%;
            padding: 30px 24px;
            font-size: 18px;
        }
    }
</style>

</head>
<body>
    <main class="container">
        хуй
    </main>
</body>
</html>
